[project]
name = "procurement-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammad hosein Salarali", email = "mhsalarali@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.16",
    "pydantic>=2.14.0",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
procurement-assistant = "procurement_assistant:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
